version: '3'
info:
  productName: Workspace Manager
  description: Local Linux developer workspaces
  version: 0.1.0

dev_mode:
  root_path: .
  log_level: warn
  debounce: 500
  ignore:
    dir: [.git, .tools, node_modules, frontend, bin, docs]
    file: ['*_test.go']
    watched_extension: ['*.go']
    git_ignore: true
  executes:
    - cmd: wails3 build DEV=true
      type: blocking
    - cmd: wails3 task common:dev:frontend
      type: background
    - cmd: wails3 task run
      type: primary
      exit_policy: shutdown
